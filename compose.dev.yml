services:
  db:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  api:
    build:
      target: development
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    command: >
      sh -c "
      npm run prisma:migrate &&
      npm run prisma:seed &&
      npm run dev
      "

  simulator:
    build:
      target: development
    volumes:
      - ./simulator:/app
      - simulator_node_modules:/app/node_modules
    command: >
      sh -c "
      npm run prisma:generate &&
      npm run dev
      "

  web:
    build:
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: npm run dev

  test:
    build:
      target: development
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    command: >
      sh -c "
      npm run prisma:migrate &&
      npm run test &&
      npm run test:integration
      "

volumes:
  api_node_modules:
  simulator_node_modules:
  web_node_modules:
